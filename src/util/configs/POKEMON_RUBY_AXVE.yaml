# =============================================================================
# 美版 Ruby (US 1.0, AXVE) — 原生参照系采集配置
# 目的：与日版 AXVJ 同屏对比 textMode/fontNum 的真实用法
#       （队伍页 / 详情页 / 战斗血条 / 开始菜单），为 text_jp2chs 全面接管定案。
# ROM：roms/origin/Pokemon Ruby Version(US).gba（1.0，与 tools/Pokemon_GBA_Font_Patch/
#      symbols/pokeruby/pokeruby.sym 地址表一致；1.1 地址会漂移勿用）
# 日志：src/util/work/POKEMON_RUBY_AXVE/gdb_patcher_log.log（按游戏分目录）
# 注意：美版不做日文 PCS 解码（原始字节）；struct Window 为 pokeruby 0x30 布局，
#       各点已带 layout:us，handler 自动切换字段偏移。
# =============================================================================
gdb:
  - name: InitTextPrinter
    address: '0x08002DC0'
    description: 'Text_InitWindow（r0=win, r1=text, r2=startOffset, r3=left, [sp]=top）'
    default: false
    cfg:
      layout: us
  - name: PrintNextChar
    address: '0x08002FE0'
    description: '字符处理器入口（r0=win）；index 未推进，text[index] 即将处理——FA..FF 控制码唯一观测点'
    default: false
    cfg:
      layout: us
  - name: Text_PrintWindow8002F44
    address: '0x08002F44'
    description: '同步打印循环（r0=win）：一次打完整串的入口'
    default: false
  - name: Text_UpdateWindow
    address: '0x080035AC'
    description: '帧驱动状态机 tick（r0=win）：state@+0x16 观测'
    default: false
    cfg:
      layout: us
  - name: Text_UpdateWindowInBattle
    address: '0x0800374C'
    description: '战斗帧驱动（r0=win）'
    default: false
    cfg:
      layout: us
  - name: UpdateTilemap
    address: '0x08006954'
    description: '表项写入（r0=win, r1=tilesWidth）——美版签名与日版不同'
    default: false
    cfg:
      layout: us
      winreg: r0
  - name: GetGlyphTilePointers
    address: '0x08003A1C'
    description: '字库取址（r0=fontNum, r1=language, r2=glyph, r3=&upper）'
    default: false
  - name: Text_ClearWindow
    address: '0x08004318'
    description: '清屏（r0=win）'
    default: false
    cfg:
      layout: us
      winreg: r0
  - name: RenderTextHandleBold
    address: '0x08004E3C'
    description: 'Text_InitWindow8004E3C（r0=winTemplate, r1=tileData/dest, r2=text）——详情页/血条缓冲渲染链'
    default: false
  - name: InitWindowTileData
    address: '0x08002A50'
    description: '等宽预加载（r0=win, r1=startOffset）——mode1 的 256-tile 静态块来源'
    default: false
  - name: DrawGlyph_TextMode0
    address: '0x08003818'
    description: 'mode0 变宽绘制（r0=win, r1=glyph）'
    default: false
  - name: DrawGlyph_TextMode2
    address: '0x0800392C'
    description: 'mode2 连续变宽绘制（r0=win, r1=glyph）'
    default: false
