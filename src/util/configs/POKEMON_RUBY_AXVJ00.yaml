    start: '0x0'
    end: '0xFFFFFF'
    type: scan
    ranges:
    - start: '0x0350864'
      end: '0x0350883'
    - start: '0x083E968D'
      end: '0x083E9691'
    - start: '0x0839724C'
      end: '0x0839724D'
    - start: '0x08397255'
      end: '0x08397258'

  - id: 其他UI界面
    label: UI界面
    group: 文本
    default: true
    description: 全 ROM；execute_filter（Menu/Text 打印函数，排除故事已消费）
    start: '0x0'
    end: '0xFFFFFF'
    type: scan
    filters:
    - id: ui_original_text_filter
      type: original_text_filter
      filter: false
      value:
        file: reference_corpus/ui.txt
        mapping: {}

  - id: 剧情
    label: 文本·剧情
    group: 文本
    default: true
    description: 全 ROM；execute_filter（ShowFieldMessage + 脚本 op message/trainerbattle）
    start: '0x0'
    end: '0xFFFFFF'
    type: scan
    reader:
      type: msg_reader
      value:
        file: reference_corpus/RubySapphire/ja-Hrkt_msg.txt
        mapping:
          "　": " "
          "\\n": "\n"
          "\\c": "\n\n"
          "\\r": "\\l"
          "\\e": ""
          "[PLAYER]": "\\01"
          "[STR_VAR_1]": "\\02"
          "[STR_VAR_2]": "\\03"
          "[STR_VAR_3]": "\\04"
          '[KUN]': \05
          '[RIVAL]': \06
          '[RIGHT_ARROW]': \CC0CFA
          '[LEFT_ARROW]': \CC0CFB
          '[UP_ARROW]': \CC0CFC
          '[DOWN_ARROW]': \CC0CFD
          '[EVIL_TEAM]': マグマだん
          '[GOOD_TEAM]': アクアだん
          '[EVIL_LEADER]': マツブサ
          '[GOOD_LEADER]': アオヤギ
    filters:
    - id: story_pointer_filter
      type: story_pointer_filter
      value: true
