gdb:
- name: InitTextPrinter
  address: '0x08002C68'
  description: 文本块开始（r0=win, r1=文本指针, r2=tile_base, r3=cur_x）
  cfg:
    charmap: configs/POKEMON_RUBY_AXVJ00/charmap.txt
- name: State7
  address: '0x08002F80'
  description: FD 占位符 state7 入口处理器（win=r4，分派 mov pc,r0 占用 r0）；验证 FD 是否走到官方路径 + 分块扫内存定位 StringVar 区（为 hook 侧占位符展开拿地址）
  default: false
  cfg:
    winreg: r4
- name: State7Skip
  address: '0x08002F78'
  description: FD state7 的 SKIP 处理器（win=r4）：index+=1 跳过占位符 id 字节。判读：拾道具消息命中 2 次=跳过正常（あ/う 另有来源）；0 次=FD 未走 state7。注意与 State7(0x08002F80,NEWLINE
    重定位)区分
  default: false
  cfg:
    winreg: r4
- name: ProcessCurrentChar
  address: '0x0800336E'
  description: 逐字符（r4=win, r3=char）；输出量大且与 InitTextPrinter 冗余
  default: false
- name: GetGlyphTilePointers
  address: '0x08003730'
  description: 官方日文字库取字（r0=fontNum, r1=glyph, r2=&upper, r3=&lower）；采集日文/半角字符的 fontNum(1bpp/4bpp) 与 glyph 范围，验证 v6 统一绘制通道
  default: false
- name: PrintNextChar
  address: '0x080032F8'
  description: 字符处理器入口（r0=win）；入口处未取字符，handler 按 text[index] 读即将处理的字节流——FA..FF 控制码也在此可见
  default: false
- name: CtrlHnd_A
  address: '0x08003324'
  description: 控制码跳表处理器之一（静态表项共 7 个，与 FA..FF 的映射待运行时确认；r4=win）
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_B
  address: '0x0800333C'
  description: 控制码跳表处理器之二
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_C
  address: '0x08003342'
  description: 控制码跳表处理器之三
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_D
  address: '0x08003346'
  description: 控制码跳表处理器之四
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_E
  address: '0x0800334A'
  description: 控制码跳表处理器之五
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_F
  address: '0x08003354'
  description: 控制码跳表处理器之六
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_G
  address: '0x08003362'
  description: 控制码跳表处理器之七
  default: false
  cfg:
    winreg: r4
- name: BattleBufferGlyph
  address: '0x0880040C'
  description: 我方 TextMode2 缓冲写入（r0=win, r1=tiles*, r2=width）；观测 win[0x20] 指针与写入内容
  default: false
  cfg:
    winreg: r0
- name: DrawInitialDownArrow
  address: '0x08003F4C'
  description: 等 A 下箭头绘制入口（r0=win）；与 CtrlHnd 命中序列对照可定位触发它的控制码
  default: false
  cfg:
    winreg: r0
- name: TextClearWindow
  address: '0x08003BA8'
  description: 清屏入口（r0=win）
  default: false
  cfg:
    winreg: r0
- name: UpdateTilemap
  address: '0x080036DC'
  description: BG 表项写入总入口（r0=win, r1=upperTile, r2=lowerTile）；定位血条区乱码：谁在哪个格写了什么 tile
  default: false
