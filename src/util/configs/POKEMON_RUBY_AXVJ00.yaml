    ranges:
    - start: '0x1C4A10'
      end: '0x1C4C8F'
    - start: '0x3E944C'
      end: '0x3E9453'
    filters:
    - id: name_min_byte_length_filter
      type: min_byte_length_filter
      value: 3
    write:
      relocate: false
      replace: false
      ## 强制slot，防止修改rom值
