    start: '0x39F638'
    end: '0x39F6F3'
    type: stride_ptr
    read:
      stride: 4
      eos_window: 48
    word_count: 13
    wrap_pages: false
    max_lines: 2

  - id: 特性说明
    label: 说明·特性
    group: 说明
    default: true
    description: 特性说明（定长槽 0x13；含とくせいなし；非指针表）
    start: '0x1CBEB4'
    end: '0x1CC47D'
    type: stride
    read:
      stride: 19
    word_count: 12
    wrap_pages: false
    max_lines: 1
    translate_rules:
    - 单行输出：禁止任何换行（不得出现实际换行或 \\n）；句末不得使用「。」
    - 全文不超过 12 个汉字（控制码占位符 {Cn} 不计入字数）；超长必须压缩语义，禁止用换行续写

  - id: 图鉴分类名
