    start: '0x3923F8'
    end: '0x397167'
    type: stride
    read:
      stride: 56
    word_count: 13
    wrap_pages: false
    max_lines: 2
  - id: 招式说明-华丽大赛
    label: 说明·华丽大赛招式
    group: 说明
    default: true
    description: 华丽大赛招式效果说明指针表（47）
    start: '0x39F638'
    end: '0x39F6F3'
    type: stride_ptr
    read:
      stride: 4
      eos_window: 48
    word_count: 13
    wrap_pages: false
    max_lines: 2
  - id: 特性说明
    label: 说明·特性
    group: 说明
    default: true
    description: 特性说明（定长槽 0x13；含とくせいなし；非指针表）
    start: '0x1CBEB4'
    end: '0x1CC47D'
    type: stride
    read:
      stride: 19
    word_count: 12
    wrap_pages: false
    max_lines: 1
    translate_rules:
    - 单行输出：禁止任何换行（不得出现实际换行或 \\n）；句末不得使用「。」
    - 全文不超过 12 个汉字（控制码占位符 {Cn} 不计入字数）；超长必须压缩语义，禁止用换行续写
  - id: 图鉴分类名
    label: 词条·图鉴分类名
    group: 词条
    default: true
    description: 图鉴条目内联分类名（+0x06，6字节00补齐）
    start: '0x384746'
    end: '0x38717D'
    type: struct
    read:
      entry_size: 28
      name_offset: 6
      eos: 0
    write:
      byte_length: 5
      relocate: true
      replace: true
      slot: true
    reuse_slot_padding: true
  - id: 图鉴说明
    label: 说明·图鉴说明
    group: 说明
    default: true
    description: 图鉴正文（定址 scan）
    start: '0x37DB9C'
    end: '0x384703'
    type: scan
    word_count: 16
    wrap_pages: false
    max_lines: 3
  - id: UI界面
    label: UI界面
    group: 文本
    default: true
    description: 全 ROM；execute_filter（Menu/Text 打印函数，排除故事已消费）
    start: '0x0'
    end: '0xFFFFFF'
    type: scan
    filters:
    - id: ui_original_text_filter
      type: original_text_filter
      filter: false
      value:
        file: reference_corpus/ui.txt
        mapping: {}
    write:
      relocate: false
      replace: true
      slot: true
  - id: 剧情
    label: 文本·剧情
    group: 文本
    default: true
    description: 全 ROM；execute_filter（ShowFieldMessage + 脚本 op message/trainerbattle）
    start: '0x0'
    end: '0xFFFFFF'
    type: scan
    reader:
      type: msg_reader
      value:
        file: reference_corpus/RubySapphire/ja-Hrkt_msg.txt
        mapping:
          "　": " "
          "\\n": "\n"
          "\\c": "\n\n"
          "\\r": "\\l"
          "\\e": ""
          '[PLAYER]': \01
          '[STR_VAR_1]': \02
          '[STR_VAR_2]': \03
          '[STR_VAR_3]': \04
          '[KUN]': \05
          '[RIVAL]': \06
          '[RIGHT_ARROW]': \CC0CFA
          '[LEFT_ARROW]': \CC0CF9
          '[UP_ARROW]': \CC0CF7
          '[DOWN_ARROW]': \CC0CF8
          '[EVIL_TEAM]': \08
          '[GOOD_TEAM]': \09
          '[EVIL_LEADER]': \0A
          '[GOOD_LEADER]': \0B
          '[B_PLAYER_NAME]': \20
          '[B_BUFF1]': \00
          '[B_BUFF2]': \01
          '[B_ATK_NAME_WITH_PREFIX]': \0C
          '[B_DEF_NAME_WITH_PREFIX]': \0D
    filters:
    - id: story_pointer_filter
      type: story_pointer_filter
      value: true
    fallback_filters:
    - id: fb_require_pointer
      type: require_pointer_filter
      value: true
    - id: fb_real_ref
      type: require_real_ref_filter
      value: true
    - id: fb_dialogue_shape
      type: dialogue_shape_filter
      value:
        enabled: true
        pointer_ok: false
    - id: fb_garbage
      type: garbage_heuristic_filter
      value: true
  - id: 补漏剧情
    label: 文本·补漏剧情
    group: 文本
    default: true
    description: 全 ROM；execute_filter（ShowFieldMessage + 脚本 op message/trainerbattle）
    start: '0x0'
    end: '0xFFFFFF'
    type: scan
    filters:
      - id: extra_story_pointer_filter
        type: require_pointer_filter
        value: true
    write:
      relocate: false
      replace: false
      ## 纯slot，防止污染
      slot: true

gdb:
- name: InitTextPrinter
  address: '0x08002C68'
  description: 文本块开始（r0=win, r1=文本指针, r2=tile_base, r3=cur_x）
  cfg:
    charmap: configs/POKEMON_RUBY_AXVJ00/charmap.txt
- name: ProcessCurrentChar
  address: '0x0800336E'
  description: 逐字符（r4=win, r3=char）；输出量大且与 InitTextPrinter 冗余
  default: false
- name: PrintNextChar
  address: '0x080032F8'
  description: 字符处理器入口（r0=win）；入口处未取字符，handler 按 text[index] 读即将处理的字节流——FA..FF 控制码也在此可见
  default: false
- name: CtrlHnd_A
  address: '0x08003324'
  description: 控制码跳表处理器之一（静态表项共 7 个，与 FA..FF 的映射待运行时确认；r4=win）
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_B
  address: '0x0800333C'
  description: 控制码跳表处理器之二
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_C
  address: '0x08003342'
  description: 控制码跳表处理器之三
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_D
  address: '0x08003346'
  description: 控制码跳表处理器之四
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_E
  address: '0x0800334A'
  description: 控制码跳表处理器之五
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_F
  address: '0x08003354'
  description: 控制码跳表处理器之六
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_G
  address: '0x08003362'
  description: 控制码跳表处理器之七
  default: false
  cfg:
    winreg: r4
- name: BattleBufferGlyph
  address: '0x0880040C'
  description: 我方 TextMode2 缓冲写入（r0=win, r1=tiles*, r2=width）；观测 win[0x20] 指针与写入内容
  default: false
  cfg:
    winreg: r0
- name: DrawInitialDownArrow
  address: '0x08003F4C'
  description: 等 A 下箭头绘制入口（r0=win）；与 CtrlHnd 命中序列对照可定位触发它的控制码
  default: false
  cfg:
    winreg: r0
- name: TextClearWindow
  address: '0x08003BA8'
  description: 清屏入口（r0=win）
  default: false
  cfg:
    winreg: r0
- name: UpdateTilemap
  address: '0x080036DC'
  description: BG 表项写入总入口（r0=win, r1=upperTile, r2=lowerTile）；定位血条区乱码：谁在哪个格写了什么 tile
  default: false
  cfg:
    winreg: r0
- name: MapNamePopupX
  address: '0x0809F6D0'
  description: 地名弹窗 MenuPrint 调用点（r0=buf, r1=注入的 x 留白px, r2=y）；配 InitTextPrinter 看 win+0x1A curX
  cfg:
    charmap: configs/POKEMON_RUBY_AXVJ00/charmap.txt
- name: MapNameHookRet
  address: '0x0880014A'
  description: 居中钩跳板 C 返回点（r0=C 计算的留白px，v3 预期 未白镇=62 / 101号道路=50）
  default: false
- name: PopupStepTrace
  address: '0x08800146'
  description: 跳板入口（push lr 后）：指令级单步跟踪整个居中钩子，前 3 次命中
  default: false
  cfg:
    charmap: configs/POKEMON_RUBY_AXVJ00/charmap.txt
- name: LoadSpriteSheet
  address: '0x080021C4'
  description: 图块 sheet → OBJ VRAM（r0=&sheet{data,size,tag}）
- name: LoadSpritePalette
  address: '0x08002410'
  description: 调色板 sheet → gPlttBuffer OBJ 区（r0=&sheet{data,size,tag}）
- name: LoadCompressedObjectPic
  address: '0x0800A77C'
  description: LZ77→0x02000000 后 LoadSpriteSheet（r0=&压缩图）
- name: LoadCompressedObjectPalette
  address: '0x0800A7D0'
  description: LZ77→0x02000000 后 LoadSpritePalette（r0=&压缩调色板）
- name: CreateSprite
  address: '0x08000BCC'
  description: 创建精灵（r0=&SpriteTemplate，AXVJ 布局 tileTag@0/paletteTag@2/oam*@4；绑定 sheet↔调色板 + 权威尺寸）
- name: LoadCompressedPalette
  address: '0x08070A4C'
  description: 压缩调色板：LZ→0x0202F0BC + 2×拷贝→gPlttBuffer*（r0=src, r1=offset, r2=size）
- name: LoadPalette
  address: '0x08070A90'
  description: 调色板 2×CpuCopy16→gPlttBufferUnfaded/Faded（r0=src, r1=offset, r2=size）
- name: LZDecompressWram
  address: '0x0800A764'
  description: LZ77 解压到 EWRAM（r0=src, r1=dest）
- name: LZDecompressVram
  address: '0x0800A770'
  description: LZ77 解压到 VRAM（r0=src, r1=dest）
- name: DrawMapNamePopup
  address: '0x0809F654'
  description: 地图名弹窗绘制入口（无 handler，仅通用日志）
- name: InitWindowTileData
  address: '0x08002A50'
  description: 分区器入口（JP 与美版同址；r0=win/template 待运行时定身份, r1=startOffset）——字库预渲染+分区链输入
  default: false
- name: InitWindowTileDataRet
  address: '0x08002AEA'
  description: 分区器出口 pop{r4-r6} 处（r0=返回值=下一空闲 offset，r4=入口 r0）——与入口成对还原分区链
  default: false
