  - id: 地点名
    label: 词条·地点
    group: 词条
    default: true
    description: 地点名表
    start: '0x3BECB7'
    end: '0x3BEF67'
    type: scan
    min_byte_length: 5
    max_byte_length: 20

  - id: 秘密基地装饰名
    label: 词条·秘密基地装饰
    group: 词条
    default: true
    description: 秘密基地装饰品名表（0x3C2A54 起 120 条，步长 0x1C 名称偏移 13）
    start: '0x3C2A54'
    end: '0x3C3773'
    type: struct
    read:
      entry_size: 28
      name_offset: 13
    write:
      byte_length: 5
      relocate: true
      replace: true
      slot: true
    reuse_slot_padding: true

  - id: 道具名
