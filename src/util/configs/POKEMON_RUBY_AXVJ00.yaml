game_id: POKEMON_RUBY_AXVJ00
game_code: AXVJ
tiles:
  # 标题 Logo/横幅与背景共用原板 0x0836D148；缺色写到此地址并改指针。
  # 勿踩字库 0x09000000。0x09200000 仅适合 util 对「未注入」原盘离线改 tile；
  # meowth full 在 build 后会忽略此值，改接到 ROM 文件末尾（防踩字库/译文）。
  new_palette: '0x09200000'
  presets:
    - id: title_banner
      label: 标题横幅
      default: true
      address: '0x0836EC6C'
      format: 8bpp
      compression: lz77_swap
      palette: '0x0836D148'
      compose:
        type: banner
        left:
          width: 8
          height: 4
        right:
          width: 4
          height: 4
    - id: title_logo
      label: 标题 Logo
      default: true
      address: '0x0836D268'
      format: 8bpp
      compression: lz77_swap
      palette: '0x0836D148'
      compose:
        type: logo
        tilemap_address: '0x0836D030'
        tilemap_size: 1024
        width: 32
        height: 32
    - id: type_icons
      label: 属性图标
      default: true
      address: '0x087EE9C8'
      format: 4bpp
      compression: lz77_swap
      sprite_size: 32x16
      count: 23
      palette: '0x087EF450'
      bank_list: 0,0,1,1,0,0,2,1,0,2,0,1,2,0,1,1,2,0,0,1,1,2,0
      pointers:
        - '0x0839747C'
texts:
  # 剧情/UI/特殊文本语料白名单（词条·说明模块不引用）
  msg_corpus: &msg_corpus
    file: reference_corpus/RubySapphire/ja-Hrkt_msg.txt
    mapping:
      "　": " "
      "\\n": "\n"
      "\\c": "\n\n"
      "\\r": "\\l"
      "\\e": ""
      "[PLAYER]": "\\01"
      "[STR_VAR_1]": "\\02"
      "[STR_VAR_2]": "\\03"
      "[STR_VAR_3]": "\\04"
      "[RIVAL]": "\\06"
      "[KUN]": ""
      "[RIGHT_ARROW]": "\\CC0CFA"
      "[LEFT_ARROW]": "\\CC0CFB"
      "[UP_ARROW]": "\\CC0CFC"
      "[DOWN_ARROW]": "\\CC0CFD"
      "[EVIL_TEAM]": "マグマだん"
      "[GOOD_TEAM]": "アクアだん"
      "[EVIL_LEADER]": "マツブサ"
      "[GOOD_LEADER]": "アオヤギ"
  filters:
    # 全局仅保留扫进危险区防护；词条/说明启发式挂在模块上；剧情/UI/特殊靠偏置锚点
    - id: global_anim_cmd_filter
      type: anim_cmd_filter
      value: true
    - id: global_ime_keyboard_filter
      type: ime_keyboard_filter
      value: true
    - id: global_title_lz_filter
      type: address_filter
      value:
        start: '0x0836D000'
        end: '0x0836FFFF'
  # 剧情偏对白 / UI 偏短标·控制符（模块 filters: *story_bias / *ui_bias）
  story_bias: &story_bias
    - id: story_msg_filter
      type: msg_filter
      filter: false
      value: *msg_corpus
    - id: story_dialogue_shape
      type: dialogue_shape_filter
      value: true
  ui_bias: &ui_bias
    - id: story_msg_filter
      type: msg_filter
      filter: false
      value: *msg_corpus
    - id: ui_assign_filter
      type: control_or_short_filter
      filter: false
      value:
        control_prefix: true
        max_plain_chars: 12
  # 说明类 scan 启发式（全局已瘦身，显式挂回）
  desc_scan_filters: &desc_scan_filters
    - id: desc_character_filter
      type: character_filter
      value: 'ＤＮＡ(*SKIP)(*FAIL)|[üÜ►♂♀ÖÄß：Ｃ-Ｚａ-ｚ]'
    - id: desc_dialogue_shape_filter
      type: dialogue_shape_filter
      value: true
    - id: desc_min_byte_length_filter
      type: min_byte_length_filter
      value: 8
    - id: desc_garbage_heuristic_filter
      type: garbage_heuristic_filter
      value: true
  styles:
    # 按列表顺序交错分配 F9：01, 81, 02, 82…（勿写 channel）
    - id: 样式1
      left: 1
  modules:
    - id: 属性名
      label: 词条·属性
      group: 词条
      default: true
      description: 属性名短表（单字注入需谨慎）
      start: '0x1cbb0c'
      end: '0x1cbb65'
      type: stride
      read:
        stride: 5
      relocate: true
      hook: true
    - id: 性格名
      label: 词条·性格
      group: 词条
      default: true
      description: 性格名表/相遇与蛋描述
      start: '0x397168'
      end: '0x39734C'
      type: stride_ptr
      read:
        stride: 4
      relocate: true
      hook: true
    - id: 特性名
      label: 词条·特性
      group: 词条
      default: true
      description: 特性名固定表
      start: '0x1cbc4c'
      end: '0x1cbeb3'
      type: stride
      read:
        stride: 8
      relocate: true
      hook: true
    - id: 宝可梦名
      label: 词条·宝可梦
      group: 词条
      default: true
      description: 宝可梦名固定表
      start: '0x1ca354'
      end: '0x1cacfb'
      type: stride
      read:
        stride: 6
      relocate: true
      hook: true
      style: 样式1
      filters:
        - id: global_character_filter
          type: character_filter
          value: '？？？？？'
          filter: true
        - id: global_dialogue_shape_filter
          type: dialogue_shape_filter
          value: false
        - id: global_min_byte_length_filter
          type: min_byte_length_filter
          value: 1
        - id: global_garbage_heuristic_filter
          type: garbage_heuristic_filter
          value: false
    - id: 招式名
      label: 词条·招式
      group: 词条
      default: true
      description: 招式名固定表
      start: '0x1cad04'
      end: '0x1cb813'
      type: stride
      read:
        stride: 8
      relocate: true
      hook: true
    - id: 训练家名
      label: 词条·训练家
      group: 词条
      default: true
      description: Trainer class 名表
      start: '0x1C4A10'
      end: '0x3E95FF'
      type: scan
      relocate: true
      hook: true
      ranges:
        - start: '0x1C4A10'
          end: '0x1C4D00'
        - start: '0x3E944C'
          end: '0x3E9453'
      filters:
        - id: desc_character_filter
          type: character_filter
          value: 'ＤＮＡ(*SKIP)(*FAIL)|[üÜ►♂♀ÖÄß：Ｃ-Ｚａ-ｚ]'
        - id: desc_dialogue_shape_filter
          type: dialogue_shape_filter
          value: false
        - id: global_min_byte_length_filter
          type: min_byte_length_filter
          value: 3
        - id: desc_garbage_heuristic_filter
          type: garbage_heuristic_filter
          value: true
    - id: 地点名
      label: 词条·地点
      group: 词条
      default: true
      description: 地点名表
      start: '0x3BECB7'
      end: '0x3BEF67'
      type: scan
      min_byte_length: 5
      max_byte_length: 20
      relocate: false
      hook: true
      filters:
        - id: global_dialogue_shape_filter
          type: dialogue_shape_filter
          value: false
        - id: global_min_byte_length_filter
          type: min_byte_length_filter
          value: 5
        - id: place_max_byte_length_filter
          type: max_byte_length_filter
          value: 20
        - id: global_garbage_heuristic_filter
          type: garbage_heuristic_filter
          value: false
    - id: 道具名
      label: 词条·道具
      group: 词条
      default: true
      description: 道具结构内名称字段
      start: '0x39a648'
      end: '0x39dca7'
      type: struct
      read:
        entry_size: 40
        desc_ptr_offset: 16
      relocate: true
      hook: true
    - id: 道具名-谜芝果
      label: 词条·谜芝果
      group: 词条
      default: true
      description: 道具结构内名称字段
      start: '0x3DC11C'
      end: '0x3DC120'
      type: struct
      read:
        entry_size: 5
        desc_ptr_offset: 16
      relocate: true
      hook: true

    - id: 道具说明
      label: 说明·道具
      group: 说明
      default: true
      description: 道具描述指针目标
      start: '0x3984DC'
      end: '0x39A647'
      type: scan
      word_count: 9
      wrap_pages: false
      max_lines: 3
      relocate: true
      hook: true
      filters: *desc_scan_filters
    - id: 招式说明
      label: 说明·招式
      group: 说明
      default: true
      description: 招式说明（定长槽 0x38；非指针表）
      start: '0x3923F8'
      end: '0x397167'
      type: stride
      read:
        stride: 56
      relocate: true
      hook: true
    - id: 特性说明
      label: 说明·特性
      group: 说明
      default: true
      description: 特性说明（定长槽 0x13；含とくせいなし；非指针表）
      start: '0x1CBEB4'
      end: '0x1CC47D'
      type: stride
      read:
        stride: 19
      relocate: true
      hook: true
      word_count: 12
      wrap_pages: false
      max_lines: 1
      translate_rules:
        - 单行输出：禁止任何换行（不得出现实际换行或 \\n）；句末不得使用「。」
        - 全文不超过 12 个汉字（控制码占位符 {Cn} 不计入字数）；超长必须压缩语义，禁止用换行续写
    - id: 图鉴说明
      label: 说明·图鉴说明
      group: 说明
      default: true
      description: 图鉴正文
      start: '0x37DB9C'
      end: '0x384703'
      type: scan
      relocate: true
      hook: true
      word_count: 16
      wrap_pages: false
      max_lines: 3
      filters: *desc_scan_filters

    # 文本大模块：词条/说明 → 剧情带 → 训练家 → UI → 特殊（差集）；地址先到先得
    - id: 前期剧情
      label: 文本·前期剧情
      group: 文本
      default: true
      description: 全 ROM 前段地址带；语料+对白形态
      start: '0x0'
      end: '0x15C6AF'
      type: scan
      relocate: true
      hook: true
      filters: *story_bias
    - id: 中期剧情
      label: 文本·中期剧情
      group: 文本
      default: true
      description: 中段地址带；语料+对白形态
      start: '0x15C6B0'
      end: '0x2AFFFF'
      type: scan
      relocate: true
      hook: true
      filters: *story_bias
    - id: 训练家对白
      label: 文本·训练家对白
      group: 文本
      default: true
      description: 训练家登场/挑战前台词池（先于后期整带）
      start: '0x3B4C01'
      end: '0x3B9200'
      type: scan
      relocate: true
      hook: true
      filters: *story_bias
    - id: 后期剧情
      label: 文本·后期剧情
      group: 文本
      default: true
      description: 后段至 ROM 末；语料+对白形态
      start: '0x2B0000'
      end: '0xFFFFFF'
      type: scan
      relocate: true
      hook: true
      filters: *story_bias
    - id: UI界面
      label: UI界面
      group: 文本
      default: true
      description: 全 ROM；语料+短标/控制符；排在剧情之后
      start: '0x0'
      end: '0xFFFFFF'
      type: scan
      relocate: true
      hook: true
      filters: *ui_bias
    - id: 特殊文本
      label: 文本·特殊文本
      group: 文本
      default: true
      description: 全 ROM；仅语料；整表导出时收剧情/UI 差集
      start: '0x0'
      end: '0xFFFFFF'
      type: scan
      relocate: true
      hook: true
      filters:
        - id: story_msg_filter
          type: msg_filter
          filter: false
          value: *msg_corpus
