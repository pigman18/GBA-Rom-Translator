  filters:
    # 扁平 id 列表；模块 filters 同 id 覆盖。
    - id: global_character_filter
      type: character_filter
      # 踢全角拉丁碎屑；保留 Ａ/Ｂ。JP PCS「ＤＮＡ」用 lookaround 放行（非代码白名单）。
      # 包含写法例: value: '^(?=.*ＤＮＡ)(?!.*test).*' 且 filter: false
      value: '(?<!Ｄ)(?<!ＤＮ)[üÜ►♂♀ÖÄß：Ｃ-Ｚａ-ｚ](?!ＮＡ)(?!Ａ)'
    - id: global_dialogue_shape_filter
      type: dialogue_shape_filter
      value: true
    - id: global_min_byte_length_filter
      type: min_byte_length_filter
      value: 8
    - id: global_garbage_heuristic_filter
      type: garbage_heuristic_filter
      value: true
  styles:
    # 按列表顺序交错分配 F9：01, 81, 02, 82…（勿写 channel）
    - id: 样式1
      left: 1
  modules:
    - id: 属性名
      label: 词条·属性
      group: 词条
      default: true
      description: 属性名短表（单字注入需谨慎）
      start: '0x1cbb0c'
      end: '0x1cbb65'
      type: stride
      read:
        stride: 5
      relocate: true
      hook: true
    - id: 性格名
      label: 词条·性格
      group: 词条
      default: true
      description: 性格名表/相遇与蛋描述
      start: '0x397168'
      end: '0x39734C'
      type: stride_ptr
      read:
        stride: 4
      relocate: true
      hook: true
    - id: 特性名
      label: 词条·特性
      group: 词条
      default: true
      description: 特性名固定表
      start: '0x1cbc4c'
      end: '0x1cbeb3'
      type: stride
      read:
        stride: 8
      relocate: true
      hook: true
    - id: 宝可梦名
      label: 词条·宝可梦
      group: 词条
      default: true
      description: 宝可梦名固定表
      start: '0x1ca354'
      end: '0x1cacfb'
      type: stride
      read:
        stride: 6
      relocate: true
      hook: true
      style: 样式1
    - id: 招式名
      label: 词条·招式
      group: 词条
      default: true
      description: 招式名固定表
      start: '0x1cad04'
      end: '0x1cb813'
      type: stride
      read:
        stride: 8
      relocate: true
      hook: true
    - id: 训练家名
      label: 词条·训练家
      group: 词条
      default: true
      description: Trainer class 名表
      start: '0x1C4A10'
      end: '0x1C4D00'
      type: scan
      relocate: true
      hook: true
    - id: 地点名
      label: 词条·地点
      group: 词条
      default: true
      description: 地点名表
      start: '0x3BECB7'
      end: '0x3BEF67'
      type: scan
      min_byte_length: 5
      max_byte_length: 20
      relocate: false
      hook: true
      filters:
        - id: global_dialogue_shape_filter
          type: dialogue_shape_filter
          value: false
        - id: global_min_byte_length_filter
          type: min_byte_length_filter
          value: 5
        - id: place_max_byte_length_filter
          type: max_byte_length_filter
          value: 20
        - id: global_garbage_heuristic_filter
          type: garbage_heuristic_filter
          value: false
    - id: 道具名
      label: 词条·道具
      group: 词条
      default: true
      description: 道具结构内名称字段
      start: '0x39a648'
      end: '0x39dca7'
      type: struct
      read:
        # 行步长 entry_size（不用 stride，避免与 type=stride 混淆）；名称读到 eos（默认 FF）
        entry_size: 40
        desc_ptr_offset: 16
      relocate: true
      hook: true
    - id: 道具说明
      label: 说明·道具
      group: 说明
      default: true
      description: 道具描述指针目标
      start: '0x3984DC'
      end: '0x39A647'
      type: scan
      # 商店说明：约 7 字/行 × 3 行；禁 \\p；末行 spill 靠绘制复位
      word_count: 7
      wrap_pages: false
      max_lines: 3
      relocate: true
      hook: true
    - id: 招式说明
      label: 说明·招式
      group: 说明
      default: true
      description: 招式说明（定长槽 0x38；非指针表）
      start: '0x3923F8'
      end: '0x397167'
      type: stride
      read:
        stride: 56
      relocate: true
      hook: true
    - id: 特性说明
      label: 说明·特性
      group: 说明
      default: true
      description: 特性说明（定长槽 0x13；含とくせいなし；非指针表）
      start: '0x1CBEB4'
      end: '0x1CC47D'
      type: stride
      read:
        stride: 19
      relocate: true
      hook: true
    - id: 图鉴说明
      label: 说明·图鉴说明
      group: 说明
      default: true
      description: 图鉴正文
      start: '0x37DB9C'
      end: '0x384703'
      type: scan
      relocate: true
      hook: true
      word_count: 16,
      wrap_pages: false,
      max_lines: 3
    - id: UI界面
      label: UI界面
      group: 界面
      default: true
      description: 整ROM按正文关键字包含扫描（菜单/UI）
      start: '0x0'
