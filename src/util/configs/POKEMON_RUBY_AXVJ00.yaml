    wrap_pages: false
    max_lines: 2

  - id: 招式说明-华丽大赛
    label: 说明·华丽大赛招式
    group: 说明
    default: true
    description: 华丽大赛招式效果说明指针表（47）
    start: '0x39F638'
    end: '0x39F6F3'
    type: stride_ptr
    read:
      stride: 4
      eos_window: 48
    word_count: 13
    wrap_pages: false
    max_lines: 2

  - id: 特性说明
    label: 说明·特性
    group: 说明
    default: true
    description: 特性说明（定长槽 0x13；含とくせいなし；非指针表）
    start: '0x1CBEB4'
    end: '0x1CC47D'
    type: stride
    read:
      stride: 19
    word_count: 12
    wrap_pages: false
    max_lines: 1
    translate_rules:
    - 单行输出：禁止任何换行（不得出现实际换行或 \\n）；句末不得使用「。」
    - 全文不超过 12 个汉字（控制码占位符 {Cn} 不计入字数）；超长必须压缩语义，禁止用换行续写

  - id: 图鉴分类名
    label: 词条·图鉴分类名
    group: 词条
    default: true
    description: 图鉴条目内联分类名（+0x06，6字节00补齐）
    start: '0x384746'
    end: '0x38717D'
    type: struct
    read:
      entry_size: 28
      name_offset: 6
      eos: 0
    write:
      byte_length: 5
      relocate: true
      replace: true
      slot: true
    reuse_slot_padding: true

  - id: 图鉴说明
    label: 说明·图鉴说明
    group: 说明
    default: true
    description: 图鉴正文（定址 scan）
    start: '0x37DB9C'
    end: '0x384703'
    type: scan
    word_count: 16
    wrap_pages: false
    max_lines: 3

  - id: 其他UI界面
    label: UI界面
    group: 文本
    default: true
    description: 全 ROM；execute_filter（Menu/Text 打印函数，排除故事已消费）
    start: '0x0'
    end: '0xFFFFFF'
    type: scan
    filters:
    - id: ui_original_text_filter
      type: original_text_filter
      filter: false
      value:
        file: reference_corpus/ui.txt
        mapping: {}

  - id: 剧情
    label: 文本·剧情
    group: 文本
    default: true
    description: 全 ROM；execute_filter（ShowFieldMessage + 脚本 op message/trainerbattle）
    start: '0x0'
    end: '0xFFFFFF'
    type: scan
    reader:
      type: msg_reader
      value:
        file: reference_corpus/RubySapphire/ja-Hrkt_msg.txt
        mapping:
          "　": " "
          "\\n": "\n"
          "\\c": "\n\n"
          "\\r": "\\l"
          "\\e": ""
          "[PLAYER]": "\\01"
          "[STR_VAR_1]": "\\02"
          "[STR_VAR_2]": "\\03"
          "[STR_VAR_3]": "\\04"
          '[KUN]': \05
          '[RIVAL]': \06
          # 方向箭头/阵营占位符均为 ROM 实测字节（2026-08 探针）：
          # UP=FC0CF7 DOWN=FC0CF8 LEFT=FC0CF9 RIGHT=FC0CFA
          # EVIL_TEAM=FD08 GOOD_TEAM=FD09 EVIL_LEADER=FD0A GOOD_LEADER=FD0B
          '[RIGHT_ARROW]': \CC0CFA
          '[LEFT_ARROW]': \CC0CF9
          '[UP_ARROW]': \CC0CF7
          '[DOWN_ARROW]': \CC0CF8
          '[EVIL_TEAM]': \08
          '[GOOD_TEAM]': \09
          '[EVIL_LEADER]': \0A
          '[GOOD_LEADER]': \0B
          # 战斗引擎占位符（ROM 实证：WinningPrize/PickedUpYen/たおれた 等）
          '[B_PLAYER_NAME]': \20
          '[B_BUFF1]': \00
          '[B_BUFF2]': \01
          '[B_ATK_NAME_WITH_PREFIX]': \0C
          '[B_DEF_NAME_WITH_PREFIX]': \0D
    filters:
    - id: story_pointer_filter
      type: story_pointer_filter
      value: true
    # 启发式兜底通道：msg_reader 未命中的整段候选改走此闸（单模块双通道），
    # 收指针索引型台词；伪命中由 mark-404/remove 链路兜底。
    fallback_filters:
    - id: fb_require_pointer
      type: require_pointer_filter
      value: true
    - id: fb_dialogue_shape
      type: dialogue_shape_filter
      value:
        enabled: true
        pointer_ok: false
    - id: fb_garbage
      type: garbage_heuristic_filter
      value: true

  - id: 树果名
    label: 词条·树果名
    group: 词条
    default: true
    description: 树果数据表（クラボ..ナゾ）；name@0，desc_ptr@12 指向说明池
      （说明池由 剧情 语料通道收录，故不设独立说明模块）
    start: '0x3A1050'
    end: '0x3A14E8'
    type: struct
    read:
      entry_size: 56
      name_offset: 0
      desc_ptr_offset: 12
