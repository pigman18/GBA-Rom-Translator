game_id: POKEMON_RUBY_AXVJ00
game_code: AXVJ
tiles:
  # 标题 Logo/横幅与背景共用原板 0x0836D148；缺色写到此地址并改指针。
  # 勿踩字库 0x09000000。0x09200000 仅适合 util 对「未注入」原盘离线改 tile；
  # meowth full 在 build 后会忽略此值，改接到 ROM 文件末尾（防踩字库/译文）。
  new_palette: '0x09200000'
  presets:
    - id: title_banner
      label: 标题横幅
      default: true
      address: '0x0836EC6C'
      format: 8bpp
      compression: lz77_swap
      palette: '0x0836D148'
      compose:
        type: banner
        left:
          width: 8
          height: 4
        right:
          width: 4
          height: 4
    - id: title_logo
      label: 标题 Logo
      default: true
      address: '0x0836D268'
      format: 8bpp
      compression: lz77_swap
      palette: '0x0836D148'
      compose:
        type: logo
        tilemap_address: '0x0836D030'
        tilemap_size: 1024
        width: 32
        height: 32
    - id: type_icons
      label: 属性图标
      default: true
      address: '0x087EE9C8'
      format: 4bpp
      compression: lz77_swap
      sprite_size: 32x16
      count: 23
      palette: '0x087EF450'
      bank_list: 0,0,1,1,0,0,2,1,0,2,0,1,2,0,1,1,2,0,0,1,1,2,0
      pointers:
        - '0x0839747C'
texts:
  filters:
    # 全局危险区；词条/说明靠定址·定长，剧情/UI 靠 callers_filter
    - id: global_anim_cmd_filter
      type: anim_cmd_filter
      value: true
    - id: global_ime_keyboard_filter
      type: ime_keyboard_filter
      value: true
    - id: global_title_lz_filter
      type: address_filter
      value:
        start: '0x0836D000'
        end: '0x0836FFFF'
  # 脚本入口（AXVJ 钉址）：callers_filter 的 script_ops 自此处 walk，非全盘 find
  # map_header_ptrs = 各组 MapHeader* 表拼接（393）；gStdScripts 自 ScrCmd_gotostd 字面量
  script_roots:
    map_header_ptrs: '0x082E03CC'
    map_header_count: 393
    gMapGroups: '0x082E09F4'
    gMapGroups_count: 33
    gStdScripts: '0x08145A48'
    gStdScripts_count: 8
  # callers_filter 只判「类文本会否被消费」：value 列表，两种项。
  # {name}（内建 op 类别）：程序自动 walk 脚本找调用点——剧情 message / 训练家 trainerbattle。
  # {name, address}：BL 逆推 r0/r1/r2 + 父级闭包（depth 默认 8）；消费叶自动映射注入叶。
  # 归属靠模块地址带/顺序，不靠 callers 再分域。
  # 各模块 filters 已改为内联 execute_filter（is_execute API）。
  styles:
    # 按列表顺序交错分配 F9：01, 81, 02, 82…（勿写 channel）
    - id: 样式1
      left: 1
  modules:
    - id: 属性名
      label: 词条·属性
      group: 词条
      default: true
      description: 属性名短表（单字注入需谨慎）
      start: '0x1cbb0c'
      end: '0x1cbb65'
      type: stride
      read:
        stride: 5
      relocate: true
      hook: true
    - id: 性格名
      label: 词条·性格
      group: 词条
      default: true
      description: 性格名指针表（25）；相遇/蛋描述走 UI callers
      start: '0x397168'
      end: '0x39734C'
      type: stride_ptr
      read:
        stride: 4
      relocate: true
      hook: true
    - id: 特性名
      label: 词条·特性
      group: 词条
      default: true
      description: 特性名固定表
      start: '0x1cbc4c'
      end: '0x1cbeb3'
      type: stride
      read:
        stride: 8
      relocate: true
      hook: true
    - id: 宝可梦名
      label: 词条·宝可梦
      group: 词条
      default: true
      description: 宝可梦名固定表
      start: '0x1ca354'
      end: '0x1cacfb'
      type: stride
      read:
        stride: 6
      relocate: true
      hook: true
      style: 样式1
      filters:
        # 占位名「？？？？？」跳过
        - id: species_skip_qmark
          type: character_filter
          value: '？？？？？'
          filter: true
    - id: 招式名
      label: 词条·招式
      group: 词条
      default: true
      description: 招式名固定表
      start: '0x1cad04'
      end: '0x1cb813'
      type: stride
      read:
        stride: 8
      relocate: true
      hook: true
    - id: 训练家名
      label: 词条·训练家
      group: 词条
      default: true
      description: Trainer class 名表（窄带定址）
      start: '0x1C4A10'
      end: '0x3E95FF'
      type: scan
      relocate: true
      hook: true
      min_byte_length: 3
      ranges:
        - start: '0x1C4A10'
          end: '0x1C4D00'
        - start: '0x3E944C'
          end: '0x3E9453'
      filters:
        - id: name_min_byte_length_filter
          type: min_byte_length_filter
          value: 3
    - id: 地点名
      label: 词条·地点
      group: 词条
      default: true
      description: 地点名表
      start: '0x3BECB7'
      end: '0x3BEF67'
      type: scan
      min_byte_length: 5
      max_byte_length: 20
      relocate: false
      hook: true
    - id: 道具名
      label: 词条·道具
      group: 词条
      default: true
      description: 道具结构内名称字段
      start: '0x39a648'
      end: '0x39dca7'
      type: struct
      read:
        entry_size: 40
        desc_ptr_offset: 16
      relocate: true
      hook: true
    - id: 道具名-谜芝果
      label: 词条·谜芝果
      group: 词条
      default: true
      description: 道具结构内名称字段
      start: '0x3DC11C'
      end: '0x3DC120'
      type: struct
      read:
        entry_size: 5
        desc_ptr_offset: 16
      relocate: true
      hook: true
    - id: 道具说明
      label: 说明·道具
      group: 说明
      default: true
      description: 道具描述指针目标（定址 scan）
      start: '0x3984DC'
      end: '0x39A647'
      type: scan
      word_count: 9
      wrap_pages: false
      max_lines: 3
      relocate: true
      hook: true
    - id: 招式说明
      label: 说明·招式
      group: 说明
      default: true
      description: 招式说明（定长槽 0x38；非指针表）
      start: '0x3923F8'
      end: '0x397167'
      type: stride
      read:
        stride: 56
      relocate: true
      hook: true
    - id: 特性说明
      label: 说明·特性
      group: 说明
      default: true
      description: 特性说明（定长槽 0x13；含とくせいなし；非指针表）
      start: '0x1CBEB4'
      end: '0x1CC47D'
      type: stride
      read:
        stride: 19
      relocate: true
      hook: true
      word_count: 12
      wrap_pages: false
      max_lines: 1
      translate_rules:
        - 单行输出：禁止任何换行（不得出现实际换行或 \\n）；句末不得使用「。」
        - 全文不超过 12 个汉字（控制码占位符 {Cn} 不计入字数）；超长必须压缩语义，禁止用换行续写
    - id: 图鉴说明
      label: 说明·图鉴说明
      group: 说明
      default: true
      description: 图鉴正文（定址 scan）
      start: '0x37DB9C'
      end: '0x384703'
      type: scan
      relocate: true
      hook: true
      word_count: 16
      wrap_pages: false
      max_lines: 3
    # 文本大模块：词条/说明 → 剧情(trainerbattle+message) → UI(菜单/文本打印)
    # 训练家对白已并入剧情（ShowTrainerIntroSpeech → ShowFieldMessage）
    - id: 剧情
      label: 文本·剧情
      group: 文本
      default: true
      description: 全 ROM；execute_filter（ShowFieldMessage + 脚本 op message/trainerbattle）
      start: '0x0'
      end: '0xFFFFFF'
      type: scan
      relocate: true
      hook: true
      filters:
        - id: story_execute
          type: execute_filter
          filter: false
          filter_id: story_execute
          value:
            - name: ShowFieldMessage
              address: '0x08061CF4'
            - name: ShowFieldAutoScrollMessage
              address: '0x08061D1C'
            - name: message
            - name: messageautoscroll
            - name: loadword
            - name: trainerbattle
    - id: UI界面
      label: UI界面
      group: 文本
      default: true
      description: 全 ROM；execute_filter（Menu/Text 打印函数，排除故事已消费）
      start: '0x0'
      end: '0xFFFFFF'
      type: scan
      relocate: true
      hook: true
      filters:
        - id: ui_execute
          type: execute_filter
          filter: false
          filter_id: ui_execute
          exclude_filters:
            - story_execute
          value:
            - name: Menu_PrintText
              address: '0x0806F16C'
            - name: MenuPrintMessage
              address: '0x0806F32C'
            - name: MenuPrintMessageDefaultCoords
              address: '0x0806F360'
            - name: Text_InitWindowAndPrintText
              address: '0x080030A8'
            - name: Contest_StartTextPrinter
              address: '0x08002D1C'
            - name: InitTextPrinter
              address: '0x08002C68'
            - name: RunTextPrinter
              address: '0x08002DE8'
            - name: ProcessCurrentChar
              address: '0x080032F8'
