      0x1CA354 起物种名）；2026-08 复核：原 end 截短尾部（ユカリ/ナナとネネ等双人组合名至マサシ），实测终点 0x1CA340
    start: '0x1C5040'
    end: '0x1CA340'
    type: struct
    read:
      entry_size: 32
      name_offset: 24
    write:
      relocate: false
      replace: false
      ## 强制slot，防止修改rom值
