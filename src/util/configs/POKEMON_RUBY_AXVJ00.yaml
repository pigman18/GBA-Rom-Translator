    start: '0x384746'
    end: '0x38717D'
    type: struct
    read:
      entry_size: 28
      name_offset: 6
      eos: 0
    write:
      byte_length: 5
      relocate: true
      replace: true
      slot: true
    reuse_slot_padding: true

  - id: 图鉴说明
    label: 说明·图鉴说明
