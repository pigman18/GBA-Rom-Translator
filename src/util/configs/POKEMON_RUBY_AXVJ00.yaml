        #  type: msg_filter
        #  filter: false
        #  value:
        #    file: reference_corpus/RubySapphire/ja-Hrkt_msg.txt
        #    min_plain_chars: 3
        #    mapping:
        #      "　": " "
        #      "\\n": "\n"
        #      "\\c": "\n\n"
        #      "\\r": "\\l"
        #      "\\e": ""
        #      "[PLAYER]": "\\01"
        #      "[STR_VAR_1]": "\\02"
        #      "[STR_VAR_2]": "\\03"
        #      "[STR_VAR_3]": "\\04"
        #      "[RIVAL]": "\\06"
        #      "[KUN]": ""
        #      "[RIGHT_ARROW]": "\\CC0CFA"
        #      "[LEFT_ARROW]": "\\CC0CFB"
        #      "[UP_ARROW]": "\\CC0CFC"
        #      "[DOWN_ARROW]": "\\CC0CFD"
        #      "[EVIL_TEAM]": "マグマだん"
        #      "[GOOD_TEAM]": "アクアだん"
        #      "[EVIL_LEADER]": "マツブサ"
        #      "[GOOD_LEADER]": "アオヤギ"
