gdb:
- name: InitTextPrinter
  address: '0x08002C68'
  description: 文本块开始（r0=win, r1=文本指针, r2=tile_base, r3=cur_x）
  cfg:
    charmap: configs/POKEMON_SAPP_AXPJ00/charmap.txt
- name: ProcessCurrentChar
  address: '0x0800336E'
  description: 逐字符（r4=win, r3=char）；输出量大且与 InitTextPrinter 冗余
  default: false
- name: PrintNextChar
  address: '0x080032F8'
  description: 字符处理器入口（r0=win）；入口处未取字符，handler 按 text[index] 读即将处理的字节流——FA..FF 控制码也在此可见
  default: false
- name: CtrlHnd_A
  address: '0x08003324'
  description: 控制码跳表处理器之一（静态表项共 7 个，与 FA..FF 的映射待运行时确认；r4=win）
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_B
  address: '0x0800333C'
  description: 控制码跳表处理器之二
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_C
  address: '0x08003342'
  description: 控制码跳表处理器之三
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_D
  address: '0x08003346'
  description: 控制码跳表处理器之四
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_E
  address: '0x0800334A'
  description: 控制码跳表处理器之五
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_F
  address: '0x08003354'
  description: 控制码跳表处理器之六
  default: false
  cfg:
    winreg: r4
- name: CtrlHnd_G
  address: '0x08003362'
  description: 控制码跳表处理器之七
  default: false
  cfg:
    winreg: r4
- name: BattleBufferGlyph
  address: '0x0880040C'
  description: 我方 TextMode2 缓冲写入（r0=win, r1=tiles*, r2=width）；观测 win[0x20] 指针与写入内容
  default: false
  cfg:
    winreg: r0
- name: DrawInitialDownArrow
  address: '0x08003F4C'
  description: 等 A 下箭头绘制入口（r0=win）；与 CtrlHnd 命中序列对照可定位触发它的控制码
  default: false
  cfg:
    winreg: r0
- name: TextClearWindow
  address: '0x08003BA8'
  description: 清屏入口（r0=win）
  default: false
  cfg:
    winreg: r0
- name: UpdateTilemap
  address: '0x080036DC'
  description: BG 表项写入总入口（r0=win, r1=upperTile, r2=lowerTile）；定位血条区乱码：谁在哪个格写了什么 tile
  default: false
  cfg:
    winreg: r0
- name: MapNamePopupX
  address: '0x0809F6D0'
  description: 地名弹窗 MenuPrint 调用点（r0=buf, r1=注入的 x 留白px, r2=y）；配 InitTextPrinter 看 win+0x1A curX
  cfg:
    charmap: configs/POKEMON_SAPP_AXPJ00/charmap.txt
- name: MapNameHookRet
  address: '0x0880014A'
  description: 居中钩跳板 C 返回点（r0=C 计算的留白px，v3 预期 未白镇=62 / 101号道路=50）
  default: false
- name: PopupStepTrace
  address: '0x08800146'
  description: 跳板入口（push lr 后）：指令级单步跟踪整个居中钩子，前 3 次命中
  default: false
  cfg:
    charmap: configs/POKEMON_SAPP_AXPJ00/charmap.txt
- name: LoadSpriteSheet
  address: '0x080021C4'
  description: 图块 sheet → OBJ VRAM（r0=&sheet{data,size,tag}）
  default: false
- name: LoadSpritePalette
  address: '0x08002410'
  description: 调色板 sheet → gPlttBuffer OBJ 区（r0=&sheet{data,size,tag}）
  default: false
- name: LoadCompressedObjectPic
  address: '0x0800A77C'
  description: LZ77→0x02000000 后 LoadSpriteSheet（r0=&压缩图）
  default: false
- name: LoadCompressedObjectPalette
  address: '0x0800A7D0'
  description: LZ77→0x02000000 后 LoadSpritePalette（r0=&压缩调色板）
  default: false
- name: CreateSprite
  address: '0x08000BCC'
  description: 创建精灵（r0=&SpriteTemplate，AXVJ 布局 tileTag@0/paletteTag@2/oam*@4；绑定 sheet↔调色板 + 权威尺寸）
  default: false
- name: LoadCompressedPalette
  address: '0x08070A4C'
  description: 压缩调色板：LZ→0x0202F0BC + 2×拷贝→gPlttBuffer*（r0=src, r1=offset, r2=size）
  default: false
- name: LoadPalette
  address: '0x08070A90'
  description: 调色板 2×CpuCopy16→gPlttBufferUnfaded/Faded（r0=src, r1=offset, r2=size）
  default: false
- name: LZDecompressWram
  address: '0x0800A764'
  description: LZ77 解压到 EWRAM（r0=src, r1=dest）
  default: false
- name: LZDecompressVram
  address: '0x0800A770'
  description: LZ77 解压到 VRAM（r0=src, r1=dest）
  default: false
- name: DrawMapNamePopup
  address: '0x0809F654'
  description: 地图名弹窗绘制入口（无 handler，仅通用日志）
  default: false
- name: InitWindowTileData
  address: '0x08002A50'
  description: 分区器入口（JP 与美版同址；r0=win/template 待运行时定身份, r1=startOffset）——字库预渲染+分区链输入
  default: false
- name: InitWindowTileDataRet
  address: '0x08002AEA'
  description: 分区器出口 pop{r4-r6} 处（r0=返回值=下一空闲 offset，r4=入口 r0）——与入口成对还原分区链
  default: false
