    min_byte_length: 5
    max_byte_length: 20
  - id: 秘密基地装饰名
    label: 词条·秘密基地装饰
    group: 词条
    default: true
    description: 秘密基地装饰品名表（0x3C2A54 起 120 条，步长 0x1C 名称偏移 13）
    start: '0x3C2A54'
    end: '0x3C3773'
    type: struct
    read:
      entry_size: 28
      name_offset: 13
    write:
      byte_length: 5
      relocate: true
      replace: true
      slot: true
    reuse_slot_padding: true
  - id: 道具名
    label: 词条·道具
    group: 词条
    default: true
    description: 道具结构内名称字段
    start: '0x39a62c'
    end: '0x39dc8b'
    type: struct
    read:
      entry_size: 40
      desc_ptr_offset: 16
  - id: 树果名
    label: 词条·树果名
    group: 词条
    default: true
    description: 树果数据表（クラボ..ナゾ）；name@0，desc_ptr@12 指向说明池 （说明池由 剧情 语料通道收录，故不设独立说明模块）
    start: '0x3A1050'
    end: '0x3A14E8'
    type: struct
    read:
      entry_size: 56
      name_offset: 0
      desc_ptr_offset: 12
  - id: 道具说明
    label: 说明·道具
    group: 说明
    default: true
    description: 道具描述指针目标
    start: '0x3984c0'
    end: '0x39a62b'
    type: scan
    word_count: 9
    wrap_pages: false
    max_lines: 3
  - id: 招式说明
    label: 说明·招式
    group: 说明
    default: true
    description: 招式说明（定长槽 0x38；非指针表）
    start: '0x3923dc'
    end: '0x39714b'
    type: stride
    read:
      stride: 56
    word_count: 13
    wrap_pages: false
    max_lines: 2
  - id: 招式说明-华丽大赛
    label: 说明·华丽大赛招式
    group: 说明
    default: true
    description: 华丽大赛招式效果说明指针表（47）
    start: '0x39F638'
    end: '0x39F6F3'
    type: stride_ptr
    read:
      stride: 4
      eos_window: 48
    word_count: 13
    wrap_pages: false
    max_lines: 2
  - id: 特性说明
    label: 说明·特性
    group: 说明
    default: true
    description: 特性说明
    start: '0x1cbe44'
    end: '0x1cc40d'
    type: stride
    read:
      stride: 19
    word_count: 12
    wrap_pages: false
    max_lines: 1
    translate_rules:
    - 单行输出：禁止任何换行（不得出现实际换行或 \\n）；句末不得使用「。」
    - 全文不超过 12 个汉字（控制码占位符 {Cn} 不计入字数）；超长必须压缩语义，禁止用换行续写
  - id: 图鉴分类名
    label: 词条·图鉴分类名
    group: 词条
    default: true
    description: 图鉴条目内联分类名（+0x06，6字节00补齐）
    start: '0x384746'
    end: '0x38717D'
    type: struct
    read:
      entry_size: 28
      name_offset: 6
      eos: 0
    write:
      byte_length: 5
      relocate: true
      replace: true
      slot: true
    reuse_slot_padding: true
  - id: 图鉴说明
    label: 说明·图鉴说明
