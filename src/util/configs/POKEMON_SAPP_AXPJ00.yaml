    start: '0x37DB9C'
    end: '0x384703'
    type: scan
    word_count: 16
    wrap_pages: false
    max_lines: 3
  - id: UI界面
    label: UI界面
    group: 文本
    default: true
    description: 全 ROM；execute_filter（Menu/Text 打印函数，排除故事已消费）
    start: '0x0'
    end: '0xFFFFFF'
    type: scan
    filters:
    - id: ui_original_text_filter
      type: original_text_filter
      filter: false
      value:
        file: reference_corpus/ui.txt
        mapping: {}
    write:
      relocate: false
      replace: true
      slot: true
  - id: 剧情
    label: 文本·剧情
    group: 文本
    default: true
    description: 全 ROM；execute_filter（ShowFieldMessage + 脚本 op message/trainerbattle）
    start: '0x0'
    end: '0xFFFFFF'
    type: scan
    reader:
      type: msg_reader
      value:
        file: reference_corpus/RubySapphire/ja-Hrkt_msg.txt
        mapping:
          　: ' '
          \n: '

            '
          \c: '


            '
          \r: \l
          \e: ''
          '[PLAYER]': \01
          '[STR_VAR_1]': \02
          '[STR_VAR_2]': \03
          '[STR_VAR_3]': \04
          '[KUN]': \05
          '[RIVAL]': \06
          '[RIGHT_ARROW]': \CC0CFA
          '[LEFT_ARROW]': \CC0CF9
          '[UP_ARROW]': \CC0CF7
          '[DOWN_ARROW]': \CC0CF8
          '[EVIL_TEAM]': \08
          '[GOOD_TEAM]': \09
          '[EVIL_LEADER]': \0A
          '[GOOD_LEADER]': \0B
          '[B_PLAYER_NAME]': \20
          '[B_BUFF1]': \00
          '[B_BUFF2]': \01
          '[B_ATK_NAME_WITH_PREFIX]': \0C
          '[B_DEF_NAME_WITH_PREFIX]': \0D
    filters:
    - id: story_pointer_filter
      type: story_pointer_filter
      value: true
    fallback_filters:
    - id: fb_require_pointer
      type: require_pointer_filter
      value: true
    - id: fb_real_ref
      type: require_real_ref_filter
      value: true
    - id: fb_dialogue_shape
      type: dialogue_shape_filter
      value:
        enabled: true
        pointer_ok: false
    - id: fb_garbage
      type: garbage_heuristic_filter
      value: true
  - id: 补漏剧情
    label: 文本·补漏剧情
    group: 文本
    default: true
    description: 全 ROM；execute_filter（ShowFieldMessage + 脚本 op message/trainerbattle）
    start: '0x0'
    end: '0xFFFFFF'
    type: scan
    filters:
    - id: extra_story_pointer_filter
      type: require_pointer_filter
