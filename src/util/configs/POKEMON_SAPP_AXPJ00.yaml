      replace: false
      slot: true
  - id: 训练家个人名
    label: 词条·训练家个人名
    group: 词条
    default: true
    description: 训练家个人名表（0x1C5040-0x1CA340，步长 0x20 名称偏移 0x18；区分于「训练家名」class 表与 0x1CA354 起物种名）；2026-08 复核：原 end 截短尾部（ユカリ/ナナとネネ等双人组合名至マサシ），实测终点
      0x1CA340
    start: '0x1C5040'
    end: '0x1CA340'
    type: struct
    read:
      entry_size: 32
      name_offset: 24
    write:
      relocate: false
      replace: false
      slot: true
  - id: 地点名
