    - 2
    - 1
    - 0
    - 2
    - 0
    - 1
    - 2
    - 0
    - 1
    - 1
    - 2
    - 0
    - 0
    - 1
    - 1
    - 2
    - 0
    pointers:
    - '0x08397460'
